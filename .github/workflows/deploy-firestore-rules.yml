name: Deploy Firestore Rules
on:
  push:
    branches: [main]
    paths: ["firestore.rules", "firestore.indexes.json"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/sa.json
      - name: Deploy rules and indexes
        run: npx firebase-tools deploy --only firestore:rules,firestore:indexes --project playatlast
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
